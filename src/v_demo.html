<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Martin Kováč – Domov Reality · digitálna vizitka</title>
<meta name="description" content="Digitálna vizitka Martina Kováča. Uložte si kontakt jedným ťuknutím.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D9B26F">
<link rel="icon" href="{{ R }}assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ A('assets/css/dcard.css') }}">
<style>
  html, body { margin: 0; background: #2440E6; min-height: 100%; }
  .vpage { max-width: 460px; margin: 0 auto; min-height: 100svh; background: #0E0E10; box-shadow: 0 0 80px rgba(0,0,0,.5); }
  @media (min-width: 520px) { body { padding: 32px 0; } .vpage { min-height: auto; border-radius: 28px; overflow: hidden; } }
  .vnote { max-width: 460px; margin: 18px auto 0; text-align: center; font: 12px/1.5 Geist, system-ui, sans-serif; color: rgba(255,255,255,.75); }
  .vnote a { color: rgba(255,255,255,.8); }
</style>
<script type="importmap">{{ importmap }}</script>
<script>window.VK = { lang: 'sk', links: {} };</script>
</head>
<body>
<main class="vpage" id="card"></main>
<p class="vnote">Ukážka digitálnej vizitky · <a href="{{ R }}digitalna-vizitka/">Chcem vlastnú</a></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
  import { newDesign } from '{{ R }}assets/js/v2/model.js';
  import { templateDefaults } from '{{ R }}assets/js/v2/templates.js';
  import { renderDigital } from '{{ R }}assets/js/v2/digital.js';
  import { qrSVG } from '{{ R }}assets/js/util.js';
  const d = newDesign({ tpl: 'noirgold', ...templateDefaults('noirgold') });
  d.f = { name: 'Martin Kováč', role: 'Realitný maklér', company: 'Domov Reality', phone: '+421 905 123 456', email: 'martin@domovreality.sk', web: 'domovreality.sk', address: 'Panská 14, Bratislava', tagline: 'Kľúče odovzdávam osobne.' };
  d.socials = { instagram: 'https://instagram.com/', linkedin: 'https://linkedin.com/' };
  renderDigital(document.getElementById('card'), d, { url: location.href, qr: (u) => qrSVG(u), heading: 'h1' });
</script>
</body>
</html>
